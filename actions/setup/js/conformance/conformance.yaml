# Semantic-convention conformance for gh-aw's OTLP output (spec §6.7, T-OT-018).
# Run with otel-conformance from open-telemetry/semantic-conventions-conformance; see
# `make validate-otel-conformance`. check-report.mjs runs afterwards and guards the
# gen_ai.* names that the blanket missing_* declarations below would otherwise hide.
runner: genai-conformance
instrumented_library: gh-aw
instrumentation_library: gh-aw
otlp_protocol: http/protobuf
expected_violations:
  - id: not_stable
    reason: semantic-conventions-genai has no stable release yet.
  - id: missing_attribute
    reason: >-
      gh-aw's own gh-aw.* and github.* attributes (D4), plus cicd.*, vcs.*, service.version and
      deployment.environment.name, which live in the main semantic-conventions registry rather than
      semantic-conventions-genai. gen_ai.* names are guarded by check-report.mjs.
  - id: missing_metric
    reason: gh-aw's own gh_aw.* metrics (D4). gen_ai.* names are guarded by check-report.mjs.
scenarios:
  agent_success_latest:
    run: node agent-run.cjs success --latest
    spans:
      - match:
          attributes:
            gen_ai.operation.name: invoke_agent
        expect:
          count: 1
          attributes:
            gen_ai.provider.name: github
            gen_ai.agent.name: CI
            gen_ai.request.model: {present: true}
            error.type: {present: false}
          instrumentation_scope:
            name: gh-aw
            schema_url: https://opentelemetry.io/schemas/1.45.0
      - match:
          kind: INTERNAL
        expect:
          count: 3
          instrumentation_scope:
            schema_url: https://opentelemetry.io/schemas/1.45.0
    metrics:
      - gen_ai.client.inference.usage.input_tokens
      - gen_ai.client.inference.usage.output_tokens
      - gen_ai.client.inference.usage.cache_read.input_tokens
      - gen_ai.client.inference.usage.cache_write.input_tokens
      - gen_ai.invoke_agent.duration
      - gh_aw.job.duration
      - gh_aw.run.duration
      - gh_aw.tokens.input
      - gh_aw.tokens.output
      - gh_aw.tokens.cache_read
      - gh_aw.tokens.cache_write
    events: []
  agent_failure_latest:
    run: node agent-run.cjs failure --latest
    spans:
      - match:
          attributes:
            gen_ai.operation.name: invoke_agent
        expect:
          count: 1
          attributes:
            gen_ai.provider.name: github
            gen_ai.agent.name: CI
            gen_ai.request.model: {present: true}
            error.type: agent_failed
          instrumentation_scope:
            name: gh-aw
            schema_url: https://opentelemetry.io/schemas/1.45.0
      - match:
          kind: INTERNAL
        expect:
          count: 3
          instrumentation_scope:
            schema_url: https://opentelemetry.io/schemas/1.45.0
    metrics:
      - gen_ai.client.inference.usage.input_tokens
      - gen_ai.client.inference.usage.output_tokens
      - gen_ai.client.inference.usage.cache_read.input_tokens
      - gen_ai.client.inference.usage.cache_write.input_tokens
      - gen_ai.invoke_agent.duration
      - gh_aw.job.duration
      - gh_aw.job.errors
      - gh_aw.run.duration
      - gh_aw.run.errors
      - gh_aw.tokens.input
      - gh_aw.tokens.output
      - gh_aw.tokens.cache_read
      - gh_aw.tokens.cache_write
    events: []
  agent_success_compat:
    # Today's default shape, kept for existing queries (D1). Each declaration names the gap it documents.
    run: node agent-run.cjs success
    spans:
      - match:
          kind: CLIENT
        expect:
          count: 1
          attributes:
            gen_ai.operation.name: chat
            gen_ai.provider.name: github
      - match:
          kind: INTERNAL
        expect:
          count: 2
    metrics:
      - gen_ai.client.token.usage
      - gen_ai.client.inference.usage.input_tokens
      - gen_ai.client.inference.usage.output_tokens
      - gen_ai.client.inference.usage.cache_read.input_tokens
      - gen_ai.client.inference.usage.cache_write.input_tokens
      - gen_ai.invoke_agent.duration
      - gh_aw.job.duration
      - gh_aw.run.duration
      - gh_aw.tokens.input
      - gh_aw.tokens.output
      - gh_aw.tokens.cache_read
      - gh_aw.tokens.cache_write
    events: []
    expected_violations:
      - id: genai_span_name_format
        context: {expected_form: chat gpt-5, keyed_attr: gen_ai.request.model, operation: chat}
        reason: >-
          G2: the compatibility agent and conclusion spans are named gh-aw.agent.* and carry
          gen_ai.operation.name=chat. The opt-in names the agent span invoke_agent <workflow>.
      - id: genai_expected_attribute_missing
        reason: >-
          G2: the compatibility spans claim operation chat, which expects per-request attributes
          (gen_ai.response.id, gen_ai.response.model, server.address) that a whole agent job does not
          have; the conclusion span also lacks usage. The opt-in drops the chat claim.
      - id: span_status_ok_set_by_instrumentation
        context: {status_code: ok}
        reason: G13 - compatibility spans set status OK on success; the opt-in leaves it UNSET.
      - id: instrumentation_scope_schema_url_missing
        context: {actual: null, expected: {present: true}}
        reason: G10 - schemaUrl is set only under the opt-in (spec §6.7).